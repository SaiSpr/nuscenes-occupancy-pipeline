[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "occupancy-perception-pipeline"
version = "0.1.0"
description = "CPU-first occupancy ground-truth generation and training-ready perception pipeline for nuScenes-style data."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "numpy==2.2.6",
  "PyYAML==6.0.2",
  "torch==2.8.0",
  "tqdm>=4.66",
  "Pillow==11.3.0"
]

[project.optional-dependencies]
reports = ["reportlab==4.4.9"]
reconstruction = [
  "open3d==0.20.0; sys_platform == 'linux' and platform_machine == 'aarch64'",
  "open3d==0.19.0; sys_platform != 'linux' or platform_machine != 'aarch64'"
]
visualization = ["matplotlib>=3.8"]
nuscenes = [
  "nuscenes-devkit>=1.1.11",
  "pyquaternion>=0.9.9"
]
dev = [
  "pytest==8.4.2"
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"

