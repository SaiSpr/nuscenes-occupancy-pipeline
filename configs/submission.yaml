# Submission profile: motion correction + Poisson surface proposals.
# Box filling is disabled to keep the two reconstruction steps interpretable.
nuscenes:
  num_sweeps: 10
  synthetic_if_missing: false
gt:
  ray_casting: true
  motion_compensation: true
  box_margin_m: 0.2
  box_fill: false
  ego_box_min: [-1.5, -1.3, -1.0]
  ego_box_max: [3.5, 1.3, 2.0]
  poisson_enabled: true
  poisson_trim_quantile: 0.3
  poisson_support_m: 1.0
model:
  name: unet_3d
  in_channels: 1
  out_channels: 3
  base_channels: 4
  multi_level: false
training:
  loss: ce
  lr_scheduler: cosine
  augment: true
  epochs: 30
  batch_size: 2
