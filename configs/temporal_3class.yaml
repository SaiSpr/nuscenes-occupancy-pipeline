nuscenes:
  num_sweeps: 10
  synthetic_if_missing: false
gt:
  ray_casting: true
  motion_compensation: true
  box_margin_m: 0.2
  box_fill: true
  ego_box_min: [-1.5, -1.3, -1.0]
  ego_box_max: [3.5, 1.3, 2.0]
  poisson_enabled: false
model:
  name: unet_3d
  in_channels: 1
  out_channels: 3
  base_channels: 8
  multi_level: true
training:
  loss: ce
  lr_scheduler: cosine
  augment: true
  epochs: 10
  batch_size: 1
